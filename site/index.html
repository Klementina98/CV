<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Name – Android Engineer</title>
    <meta name="description" content="Android engineer specialising in Kotlin and Jetpack Compose. View my interactive CV or download the PDF.">
    <meta property="og:title" content="Your Name – Android Engineer">
    <meta property="og:description" content="Kotlin & Jetpack Compose. Interactive CV built with Compose Multiplatform.">
    <meta property="og:type" content="website">
    <style>
        :root { color-scheme: light dark; --accent: #3ddc84; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
               font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5; }
        main { max-width: 640px; }
        h1 { font-size: clamp(2rem, 6vw, 3.25rem); margin: 0 0 4px; }
        .role { color: var(--accent); font-size: 1.25rem; margin: 0 0 16px; font-weight: 600; }
        .buttons { display: flex; flex-wrap: wrap; gap: 12px; margin: 24px 0; }
        a.btn { padding: 12px 20px; border-radius: 999px; text-decoration: none; font-weight: 600;
                border: 2px solid var(--accent); color: inherit; }
        a.btn.primary { background: var(--accent); color: #062d17; }
        a.btn:focus-visible { outline: 3px solid currentColor; outline-offset: 3px; }
        small { opacity: .7; }
    </style>
</head>
<body>
<main>
    <h1>Your Name</h1>
    <p class="role">Android Engineer</p>
    <p>Replace with a short pitch: Kotlin, Jetpack Compose, what you've shipped and what you're looking for.</p>
    <div class="buttons">
        <a class="btn primary" href="app/">View interactive CV</a>
        <a class="btn" href="cv.pdf">Download PDF</a>
        <a class="btn" href="https://github.com/your-handle" rel="noopener">GitHub</a>
        <a class="btn" href="https://www.linkedin.com/in/your-handle" rel="noopener">LinkedIn</a>
    </div>
    <small>The interactive CV is built with Compose Multiplatform (Wasm) and needs a recent Chrome, Firefox or Safari 18.2+.</small>
</main>
</body>
</html>
